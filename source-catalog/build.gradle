plugins { id 'application' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
dependencies {
    implementation libs.gson
    testImplementation libs.junit5
}
application { mainClass = 'org.bookgetter.catalog.SourceCatalogManager' }
test { useJUnitPlatform() }

['update', 'verify', 'list'].each { command ->
    tasks.register("${command}Catalog", JavaExec) {
        group = 'source catalog'
        dependsOn classes
        classpath = sourceSets.main.runtimeClasspath
        mainClass = application.mainClass
        args command, projectDir.absolutePath
    }
}

tasks.register('checkCatalogConfig', JavaExec) {
    group = 'source catalog'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args 'check-config', projectDir.absolutePath
}
