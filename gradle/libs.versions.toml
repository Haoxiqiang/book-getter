[versions]
agp = "8.13.2"
gson = "2.14.0"
jsoup = "1.23.2"
jsonpath = "3.0.0"
rhino = "1.7.15"
quick-transfer = "0.2.17"
okhttp = "3.14.9"
webkit = "1.15.0"
re2j = "1.8"
desugar = "2.1.5"
junit4 = "4.13.2"
junit5 = "5.11.4"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
jsonpath = { module = "com.jayway.jsonpath:json-path", version.ref = "jsonpath" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
quick-transfer = { module = "com.github.liuyueyi.quick-chinese-transfer:quick-transfer-core", version.ref = "quick-transfer" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit5 = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
