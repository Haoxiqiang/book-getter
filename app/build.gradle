plugins { id 'com.android.application' }
android {
    namespace 'org.bookgetter.app'
    compileSdk 36
    defaultConfig { applicationId 'org.bookgetter.app'; minSdk 23; targetSdk 36; versionCode 1; versionName '0.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
}
dependencies {
    implementation project(':source-core')
    implementation project(':source-runtime-android')
    implementation project(':export')
}
