plugins { id 'java-library' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
dependencies {
    api libs.gson
    implementation libs.jsoup
    implementation libs.jsonpath
    implementation libs.rhino
    implementation libs.quick.transfer
    testImplementation libs.junit5
}
test { useJUnitPlatform() }

tasks.register('liveSourceProbe', JavaExec) {
    group = 'verification'
    description = 'Opt-in, rate-limited live search probe of the primary or supplemental source JSON.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.bookgetter.core.LiveSourceProbe'
    workingDir = rootProject.projectDir
    if (project.hasProperty('probeJsonUrl')) {
        args '--json-url', project.property('probeJsonUrl').toString()
    } else {
        args '--catalog', rootProject.file('source-catalog').absolutePath
    }
    if (project.hasProperty('probeSource')) {
        args '--source', project.property('probeSource').toString()
    }
    if (project.hasProperty('probeExploreFirst') && project.property('probeExploreFirst').toString().toBoolean()) {
        args '--explore-first'
    }
    if (project.hasProperty('probeCatalogFirst') && project.property('probeCatalogFirst').toString().toBoolean()) {
        args '--catalog-first'
    } else if (project.hasProperty('probeCaptureFirst') && project.property('probeCaptureFirst').toString().toBoolean()) {
        args '--capture-first'
    }
    if (project.hasProperty('probeChapterIndex')) {
        args '--chapter-index', project.property('probeChapterIndex').toString()
    }
    if (project.hasProperty('probeExportFirst')) {
        args '--export-first', rootProject.file(project.property('probeExportFirst').toString()).absolutePath
    }
    if (project.hasProperty('probeBookUrl')) {
        args '--book-url', project.property('probeBookUrl').toString()
    }
    if (project.hasProperty('probeQueries')) {
        args project.property('probeQueries').toString().split(',').collect { it.trim() }
    }
}

tasks.register('batchDownloadProbe', JavaExec) {
    group = 'verification'
    description = 'Opt-in, rate-limited, resumable live book download verification.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.bookgetter.core.BatchDownloadProbe'
    workingDir = rootProject.projectDir
    args rootProject.file(project.findProperty('batchCatalog') ?: 'source-catalog').absolutePath,
            rootProject.file(project.findProperty('batchOutput') ?: 'downloads/batch').absolutePath,
            project.findProperty('batchSource') ?: 'novelia.cc',
            project.findProperty('batchTarget') ?: '3',
            project.findProperty('batchMaxChapters') ?: '40',
            project.findProperty('batchMaxPages') ?: '10',
            project.findProperty('batchDelayMs') ?: '2000'
    if (project.hasProperty('batchBookUrl')) args project.property('batchBookUrl').toString()
}

tasks.register('comicDownloadProbe', JavaExec) {
    group = 'verification'
    description = 'Opt-in, rate-limited, resumable exact comic download verification.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.bookgetter.core.ComicDownloadProbe'
    workingDir = rootProject.projectDir
    args rootProject.file(project.findProperty('comicCatalog') ?: 'source-catalog').absolutePath,
            rootProject.file(project.findProperty('comicOutput') ?: 'downloads/targets/comic').absolutePath,
            project.findProperty('comicSource') ?: '包子漫画',
            project.findProperty('comicBookUrl') ?: '',
            project.findProperty('comicMaxChapters') ?: '300',
            project.findProperty('comicDelayMs') ?: '1500',
            project.findProperty('comicParallel') ?: '1'
}

tasks.register('auditBookDownloads', JavaExec) {
    group = 'verification'
    description = 'Offline independent check of distinct URLs, chapter caches, TXT sizes and SHA-256.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.bookgetter.core.BookDownloadAudit'
    workingDir = rootProject.projectDir
    args rootProject.file(project.findProperty('auditBooks') ?: 'downloads/batch/books').absolutePath,
            project.findProperty('auditSource') ?: 'https://n.novelia.cc/',
            project.findProperty('auditMinimum') ?: '1'
}

tasks.register('auditComicDownload', JavaExec) {
    group = 'verification'
    description = 'Offline independent check of a complete comic download and every CBZ image.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.bookgetter.core.ComicDownloadAudit'
    workingDir = rootProject.projectDir
    args rootProject.file(project.findProperty('auditComic') ?: 'downloads/targets/prince-of-tennis').absolutePath,
            project.findProperty('auditComicSource') ?: 'https://cn.bzmanga.com',
            project.findProperty('auditComicChapters') ?: '184'
}

tasks.register('probeMiaogongziDirectory', JavaExec) {
    group = 'verification'
    description = 'Opt-in live discovery of Miaogongzi collections and an optional selected feed.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.bookgetter.core.MiaogongziDirectoryLiveProbe'
    if (project.hasProperty('directoryCollection')) args project.property('directoryCollection').toString()
}
